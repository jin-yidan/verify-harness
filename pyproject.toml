[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rlverify"
version = "0.1.0"
description = "Conversational Lean 4 verification for statistics, RL, and mathematics"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
    "httpx>=0.25",
    "keyring>=24.0",
    "mcp>=1.0",
    "platformdirs>=4.0",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# PDF ingestion (`harness verify paper.pdf`) reads the text layer via pypdf.
# Optional: every other input form (folder, .tex/.md, arXiv link, stdin) works
# without it, and the CLI fails with an install hint rather than a traceback.
pdf = [
    "pypdf>=4.0",
]

[project.scripts]
verify = "verify_app.main:main"
rlverify = "rlverify.cli:main"
harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["verify_app*", "rlverify*", "harness*"]
